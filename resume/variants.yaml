  families: [swe-ml]
  sections: [education, experience, projects, skills]
  order:
    projects: [strand, forge, howtowin, sherlock, conch, neuro]
  exclude: [pokerbots, grimoire, astraia, neuro, induction-note, conch]
  bulletOrder:
    partial-role: [partial-founded, partial-engine-performance, partial-cross-asset-repricing]
  maxBulletsPerEntry: 2

hardware:
