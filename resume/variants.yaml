# Headlines follow the 2026-10-01 research: none on the master; each variant names its target role.
master:
  # No fixed headline on the master; each tailored variant names its target role.
  sections: [education, experience, projects, skills]
  maxPages: 2

quant:
  headline: Quantitative Developer
  families: [quant]
  sections: [education, experience, projects, skills]
